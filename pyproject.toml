[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "himvhad"
version = "0.1.0"
description = "Auditable zero-label HIMVH financial anomaly detection adaptation"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "pandas>=2.2,<3", "scikit-learn==1.7.2", "torch>=2.6", "threadpoolctl>=3"]

[project.optional-dependencies]
test = ["pytest>=8"]
report = ["matplotlib==3.9.3"]

[project.scripts]
himvhad = "himvhad.cli:main"

[tool.setuptools.packages.find]
include = ["himvhad*"]

[tool.setuptools.package-data]
himvhad = ["benchmark_sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
